plugins { id 'application' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    maven {
        url = uri(providers.gradleProperty('prismRepository').get())
        content { includeGroup 'io.github.silbaram.prism' }
        metadataSources {
            if (providers.gradleProperty('metadataFormat').get() == 'module') {
                gradleMetadata() // Do not let a working POM hide broken or missing module metadata.
            } else {
                mavenPom()
                ignoreGradleMetadataRedirection()
            }
        }
    }
    mavenCentral { content { excludeGroup 'io.github.silbaram.prism' } }
}

dependencies {
    implementation "io.github.silbaram.prism:prism-sdk:${providers.gradleProperty('prismVersion').get()}"
    if (providers.gradleProperty('targetingCompatibility').get() == 'spel') {
        runtimeOnly "io.github.silbaram.prism:prism-targeting-spel:${providers.gradleProperty('prismVersion').get()}"
    }
}

// Recheck freshly published SNAPSHOT artifacts on every verification run.
configurations.configureEach { resolutionStrategy.cacheChangingModulesFor 0, 'seconds' }

application { mainClass = 'SdkConsumer' }

tasks.register('verifyRuntimeBoundary') {
    doLast {
        def springComponents = configurations.runtimeClasspath.incoming.resolutionResult.allComponents.findAll {
            it.moduleVersion?.group?.startsWith('org.springframework')
        }
        if (providers.gradleProperty('targetingCompatibility').get() == 'spel') {
            assert springComponents.any { it.moduleVersion.name == 'spring-expression' }
        } else {
            assert springComponents.empty : "Default SDK imported Spring: ${springComponents}"
        }
    }
}

tasks.named('run') {
    dependsOn 'verifyRuntimeBoundary'
    systemProperty 'prism.consumer.legacy', providers.gradleProperty('targetingCompatibility').get() == 'spel'
}
