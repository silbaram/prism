<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/default :: layout(~{::div})}">
<div class="container">
    <h3 th:text="${experiment.key + ' · 퍼널 사용자'}"></h3>
    <p style="white-space: pre-wrap" th:text="${#strings.listJoin(query.steps, ' → ')}"></p>
    <p>변형 <strong style="white-space: pre-wrap" th:text="${variant}"></strong> ·
        <span th:text="${selection == 'PENDING' ? '관측 중' : (stage + '단계 ' + (selection == 'REACHED' ? '도달' : '직전 단계에서 미도달'))}"></span></p>
    <p><span th:text="${query.from}"></span> ≤ 발생 시각 (UTC) &lt; <span th:text="${query.until}"></span> · 제한 시간 <span th:text="${query.windowHours}"></span>시간</p>
    <p>퍼널과 동일한 순서·노출 귀속·제한 시간으로 판정합니다. 미도달은 직전 단계까지 도달했지만 해당 단계에 도달하지 않은 사용자입니다.
        관측 중 사용자는 도달·미도달 목록에서 제외합니다. 늦게 수집된 이벤트로 재조회 결과가 달라질 수 있습니다.</p>
    <div class="table-responsive"><table class="table table-striped" id="funnelUsers">
        <thead><tr><th>사용자 ID</th><th>첫 단계 (UTC)</th><th>마지막 도달 (UTC)</th><th>도달 단계</th><th>상태</th></tr></thead>
        <tbody>
        <tr th:each="user : ${users.items}">
            <td><a style="white-space: pre-wrap" th:text="${user.userId}" th:href="@{/admin/experiments/{id}/journeys/user(id=${experiment.id},userId=${user.userId},variant=${variant},from=${query.from},until=${query.until},size=${size},steps=${steps},windowHours=${query.windowHours},stage=${stage},selection=${selection},listSource=${navigation.listSource},listFilterUser=${navigation.listFilterUser},listFilterVariant=${navigation.listFilterVariant},listGoalState=${navigation.listGoalState},listSize=${navigation.listSize},listAfterUser=${navigation.listAfterUser},listAfterVariant=${navigation.listAfterVariant})}"></a></td>
            <td th:text="${user.firstAt}"></td><td th:text="${user.lastReachedAt}"></td><td th:text="${user.reached + '/' + query.steps.size}"></td>
            <td th:text="${user.pending ? '관측 중' : (user.reached == query.steps.size ? '모든 단계 도달' : '조회 조건 내 다음 단계 미도달')}"></td>
        </tr>
        <tr th:if="${users.items.empty}"><td colspan="5">조건에 맞는 사용자가 없습니다.</td></tr>
        </tbody>
    </table></div>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" th:href="@{/admin/experiments/{id}/funnel(id=${experiment.id},steps=${steps},from=${query.from},until=${query.until},windowHours=${query.windowHours})}">퍼널로 돌아가기</a>
        <a class="btn btn-outline-secondary" th:href="@{/admin/experiments/{id}/funnel/users(id=${experiment.id},steps=${steps},from=${query.from},until=${query.until},windowHours=${query.windowHours},variant=${variant},stage=${stage},selection=${selection},size=${size})}">처음부터 조회</a>
        <a th:if="${users.nextUser != null}" class="btn btn-primary" th:href="@{/admin/experiments/{id}/funnel/users(id=${experiment.id},steps=${steps},from=${query.from},until=${query.until},windowHours=${query.windowHours},variant=${variant},stage=${stage},selection=${selection},size=${size},afterUser=${users.nextUser})}">다음 사용자</a>
    </div>
</div>
</th:block>
</html>
