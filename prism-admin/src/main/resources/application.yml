server:
  port: 8070
  # Eight 255-character Unicode event names plus drill-down state exceed Tomcat's default 8KB request line/header limit.
  max-http-request-header-size: 64KB

spring:
  config:
    import:
      - classpath:application-infrastructure-jpa.yml

  # HTTP 인코딩 설정
  web:
    resources:
      add-mappings: true

  # Thymeleaf 인코딩 설정
  thymeleaf:
    encoding: UTF-8
    mode: HTML
    cache: false
