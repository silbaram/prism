version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: prism-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prism
    ports:
      - "3306:3306"
    volumes:
      - ../prism-infrastructure/persistence-jpa/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
